<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — Crop Procurement</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span class="icon">🌾</span>
        <div>
          <div>Procurement Admin</div>
          <div class="admin-brand-sub">Center check-in desk</div>
        </div>
      </div>
      <nav id="adminNav"></nav>
      <div class="admin-sidebar-footer">
        <button class="admin-logout" id="logoutBtn">Log out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
        <div class="admin-whoami" id="whoami"></div>
      </div>
      <div id="adminContent"></div>
    </main>
  </div>

  <div class="admin-modal-overlay hidden" id="modalOverlay">
    <div class="admin-modal" id="modalBody"></div>
  </div>

  <div class="admin-toast hidden" id="toast"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
